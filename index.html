<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E2785">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Side Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Starter Quest app shell. A banner band in the theme color on top, one phone-width column of square-cornered panels, a bottom tab bar. The lore counter takes the whole screen, opponent half in the banner color, turned to face across the table. */
:root{
  --banner:#2E2785; --on-banner:#FFFFFF; --on-banner-2:rgba(255,255,255,.78); --banner-line:rgba(255,255,255,.18);
  --bg:#F1F0FA; --surface:#FFFFFF; --soft:#F1F0FA; --fg:#1A1838; --muted:#4B4868; --line:#E1DFEF;
  --primary:#3D35A8; --primary-text:#3D35A8; --on-primary:#FFFFFF;
  --gold:#E3A72F; --on-gold:#1A1A1A; --gold-text:#8A5E06;
  --win:#1F7A4D; --loss:#B4233A; --draw:#6B6880;
  --amber:#E9A23B; --amethyst:#8148B8; --emerald:#2E8B57; --ruby:#C8283D; --sapphire:#2F6FC4; --steel:#7D8A96;
  --font-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-sq]){
  --banner:#1D1B3A; --on-banner:#ECECF2; --on-banner-2:rgba(236,236,242,.72); --banner-line:rgba(255,255,255,.12);
  --bg:#131319; --surface:#1D1D26; --soft:#24242F; --fg:#ECECF2; --muted:#A6A6B8; --line:#2C2C38;
  --primary:#8C84F0; --primary-text:#ABA5F5; --on-primary:#131319; --gold-text:#E3A72F;
  --win:#4CC283; --loss:#F06478; --draw:#A8A1BE; color-scheme:dark}}
:root[data-theme="dark"]:not([data-sq]),:root[data-sq="escuro"]{
  --banner:#1D1B3A; --on-banner:#ECECF2; --on-banner-2:rgba(236,236,242,.72); --banner-line:rgba(255,255,255,.12);
  --bg:#131319; --surface:#1D1D26; --soft:#24242F; --fg:#ECECF2; --muted:#A6A6B8; --line:#2C2C38;
  --primary:#8C84F0; --primary-text:#ABA5F5; --on-primary:#131319; --gold-text:#E3A72F;
  --win:#4CC283; --loss:#F06478; --draw:#A8A1BE; color-scheme:dark}
:root[data-sq="floresta"]{--banner:#1F5A41; --bg:#EFF4EE; --soft:#EFF4EE; --fg:#18241D; --muted:#4A5A50; --line:#DCE3DC; --primary:#24654A; --primary-text:#1F5A41}
:root[data-sq="fliperama"]{--banner:#2E2785; --bg:#F1F0FA; --soft:#F1F0FA; --fg:#1A1838; --muted:#4B4868; --line:#E1DFEF; --primary:#3D35A8; --primary-text:#3D35A8}
:root[data-sq="oceano"]{--banner:#0C5672; --bg:#EDF5F7; --soft:#EDF5F7; --fg:#0F2533; --muted:#405866; --line:#D6E4E9; --primary:#0E6A8C; --primary-text:#0C5E7C}
:root[data-sq="floresta"],:root[data-sq="fliperama"],:root[data-sq="oceano"]{--on-banner:#FFFFFF; --on-banner-2:rgba(255,255,255,.78); --banner-line:rgba(255,255,255,.18); --surface:#FFFFFF; --on-primary:#FFFFFF; --gold-text:#8A5E06; --win:#1F7A4D; --loss:#B4233A; --draw:#6B6880; color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--banner)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}

/* banner */
.banner{background:var(--banner);color:var(--on-banner)}
.banner-in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand .bt{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--font-display);font-weight:700;font-size:1.3rem;line-height:1.1;letter-spacing:-.01em}
.brand span{font-size:.78rem;color:var(--on-banner-2)}
.bright{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.status{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:var(--r);border:1px solid var(--banner-line);color:var(--on-banner-2);white-space:nowrap}
.status.warn{border-color:var(--gold);color:var(--gold)}
.swatches{display:flex;gap:0}
.swatches button{width:30px;height:30px;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.swatches span{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.swatches button[aria-pressed="true"] span{box-shadow:0 0 0 1.5px rgba(255,255,255,.7),0 0 0 4px #FFFFFF}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--on-banner);font-weight:600;min-height:44px}
.banner h1{color:var(--on-banner);font-size:1.35rem}
.banner-title{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 18px}
.banner-title .eyebrow{color:var(--on-banner-2)}

.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{border-top:3px solid var(--gold)}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.big{min-height:56px;font-size:1.05rem;width:100%}
.btn.wide{width:100%}
.btn.danger{color:var(--loss);border-color:var(--loss);background:transparent}
.btn.small{min-height:40px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{background:none;border:0;padding:0;color:var(--primary-text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;min-width:0}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);font-weight:400}
textarea{min-height:84px;resize:vertical}
textarea.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.85rem;min-height:220px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.sugg{font-weight:400;border-style:dashed}
.chip.sugg[aria-pressed="true"]{font-weight:600;border-style:solid}
.inks{display:inline-flex;gap:1px;align-items:center;vertical-align:middle;flex:none}
.seal{width:24px;height:24px;flex:none;display:block;object-fit:contain}
.inkpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.inkbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:.72rem;font-weight:600;min-width:0}
.inkbtn .seal{width:42px;height:42px}
.inkbtn[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--soft)}
.inkbtn:disabled{opacity:.35}
.deckopt{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600}
.deckopt[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--soft)}
.res{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:var(--r);font-weight:700;font-size:.8rem;color:#fff;font-family:var(--font-display)}
.res.win{background:var(--win)} .res.loss{background:var(--loss)} .res.draw{background:var(--draw)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.card .tile{background:var(--bg)}
.tile b{display:block;font-family:var(--font-display);font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.78rem;color:var(--muted)}
.tile b.money,.nw{white-space:nowrap}
.bar{height:6px;border-radius:2px;background:var(--soft);overflow:hidden}
.card .bar{background:var(--line)}
.bar i{display:block;height:100%;background:var(--primary)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .bar{grid-column:1/-1}
.flag{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:var(--r);padding:1px 6px;margin-left:6px;font-weight:500;white-space:nowrap}
.money{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--win)} .neg{color:var(--loss)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty ol{text-align:left;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{position:relative;background:none;border:0;min-height:62px;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--primary-text)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
.confirm{border:1px solid var(--loss);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.prize{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.games{display:flex;gap:6px;flex-wrap:wrap}
.gchip{font-size:.8rem;padding:3px 8px;border-radius:var(--r);background:var(--soft);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}
.gamebox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.gamebox .lbl{font-size:.78rem;color:var(--muted);font-weight:600}
.score2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.score2 span{color:var(--muted)}
.dl{display:flex;flex-direction:column}
.dl-row{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem;align-items:baseline}
.dl-row:first-child{border-top:0}
.dl-row b{font-family:var(--font-display);font-variant-numeric:tabular-nums;text-align:right}
.dl-row small{color:var(--muted);font-variant-numeric:tabular-nums}
.diff{font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.diff .in{color:var(--win)} .diff .out{color:var(--loss)}
.warnline{font-size:.85rem;color:var(--gold-text);font-weight:600}
.okline{font-size:.85rem;color:var(--win);font-weight:600}

/* Counter */
.counter{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:1fr auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:14px 16px;min-height:0}
.side.opp{transform:rotate(180deg);background:var(--banner);color:var(--on-banner)}
.side.me{background:var(--surface)}
.side-head{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.starts{background:var(--gold);color:var(--on-gold);border-radius:var(--r);padding:2px 8px;font-size:.66rem;opacity:1}
.lore-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%;max-width:440px}
.lore{font-family:var(--font-display);font-weight:800;font-size:clamp(4.5rem,22vw,8rem);line-height:1;text-align:center;min-width:2.2ch;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.lore-btn{height:88px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);font-size:2.2rem;font-weight:600;font-family:var(--font-display);color:var(--fg)}
.side.opp .lore-btn{background:transparent;border-color:var(--banner-line);color:var(--on-banner)}
.side .lore-btn.plus{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.quick{display:flex;gap:8px}
.quick button{min-width:64px;min-height:44px;border-radius:var(--r);border:1px solid var(--line);background:transparent;font-weight:600}
.side.opp .quick button{border-color:var(--banner-line);color:var(--on-banner)}
.pips{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;width:100%;max-width:440px}
.pips i{height:6px;background:var(--line)}
.side.opp .pips i{background:var(--banner-line)}
.side .pips i.on{background:var(--gold)}
.pips i:nth-child(5n){margin-right:3px}
.mid{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-block:1px solid var(--line);background:var(--bg)}
.mid-info{text-align:center;font-size:.82rem;line-height:1.3;min-width:0}
.mid-info strong{font-family:var(--font-display);font-size:1rem}
.mid .btn{min-height:42px;padding:6px 12px;font-size:.85rem}
.overlay{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 72%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--r);padding:20px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:calc(100% - 32px);overflow:auto}
.sheet .score{font-family:var(--font-display);font-weight:800;font-size:2.6rem;text-align:center;font-variant-numeric:tabular-nums}
.mbtn{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.mbtn:first-child{border-top:0}
.mbtn .bar{display:block}
.mbtn .chev{color:var(--muted);font-size:1.1rem;margin-left:4px}
.evo{position:relative}
.evo svg{display:block;width:100%;height:auto;touch-action:pan-y}
.evo-tip{position:absolute;top:0;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:.78rem;padding:6px 9px;border-radius:var(--r);pointer-events:none;white-space:nowrap;line-height:1.35}
.mx-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.mx{border-collapse:separate;border-spacing:2px;font-size:.85rem;min-width:100%}
.mx th{font-weight:600;text-align:center;padding:4px;vertical-align:bottom}
.mx th.rowh{text-align:left;min-width:150px;max-width:180px;font-weight:600;overflow-wrap:break-word;position:sticky;left:0;background:var(--surface);z-index:1}
.mx td{text-align:center;padding:8px 6px;border-radius:2px;font-variant-numeric:tabular-nums;min-width:62px;line-height:1.25}
.mx td b{font-family:var(--font-display)}
.mx td small{display:block;color:var(--muted);font-size:.72rem}
.mx td.none{color:var(--muted)}
.mx .inks{justify-content:center}
.hist-note{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.hist-note:first-child{border-top:0}
.tagcount{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.tagcount b{font-family:var(--font-display)}
.vs-box{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);padding:10px 12px;background:var(--bg);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
/* v1.0 */
.tabs button .dot{position:absolute;top:9px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--loss);box-shadow:0 0 0 2px var(--surface)}
.swq-row{display:flex;flex-wrap:wrap;gap:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filters>*{min-width:0}
@media (max-width:420px){.filters{grid-template-columns:1fr}}
.swq{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);padding:0}
.swq[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}
.srow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.srow:first-child{border-top:0}
button.srow{cursor:pointer}
.srow-top{display:flex;align-items:center;gap:10px;min-width:0}
.srow-t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.srow-p{font-family:var(--font-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow-c{color:var(--muted);font-size:1.2rem;line-height:1}
.srow-sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:.84rem;color:var(--muted);line-height:1.4}
.srow-sub>span{min-width:0;overflow-wrap:anywhere}
.srow .bar{display:block}
.evo-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted)}
.evo-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.addtag{display:flex;gap:8px}
.addtag input{flex:1;min-width:0}
.exp-row{display:flex;gap:8px;flex-wrap:wrap}
.exp-row select{flex:1 1 200px;min-width:0}
@media (max-width:400px){.inkpick{grid-template-columns:repeat(3,minmax(0,1fr))}.twin{grid-template-columns:1fr}.tile{padding:10px}.tile b{font-size:1.35rem}}
@media (max-width:340px){.tiles{grid-template-columns:1fr 1fr}}
@media (max-height:640px){.lore-btn{height:64px}.lore{font-size:4.2rem}.quick button{min-height:38px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.inkbtn,.deckopt,.lore-btn{transition:transform .08s ease,background-color .15s ease}.btn:active,.lore-btn:active,.chip:active{transform:scale(.97)}}
</style>

function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++){c=c[k[i]]}c[k[k.length-1]]=v}
function getPath(o,p){return p.split('.').reduce((c,k)=>c&&c[k],o)}

/* ---------- decklist (duels.ink: "4 Ursula - Deceiver (3-90)") ---------- */
function parseList(text){
  const cards=[],bad=[];
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();if(!line||/^(#|\/\/)/.test(line))return;
    const m=line.match(/^(\d+)\s*x?\s+(.+?)\s*(?:\(([^()]+)\))?$/i);
    if(!m){bad.push(line);return}
    cards.push({qty:parseInt(m[1],10),name:m[2].trim(),print:m[3]?m[3].trim():''});
  });
  const total=cards.reduce((s,c)=>s+c.qty,0);
  const byName={};cards.forEach(c=>{const k=c.name.toLowerCase();byName[k]=(byName[k]||{name:c.name,qty:0});byName[k].qty+=c.qty});
  const over=Object.values(byName).filter(x=>x.qty>4);
  return{cards,bad,total,over,byName};
}
function listCheck(p){
  if(!p.cards.length&&!p.bad.length)return'';
  const msgs=[];
  if(p.total!==60)msgs.push(`${p.total} cartas (o deck precisa ter 60)`);
  if(p.over.length)msgs.push('mais de 4 cópias: '+p.over.map(o=>esc(o.name)).join(', '));
  if(p.bad.length)msgs.push(`${p.bad.length} linha${p.bad.length>1?'s':''} fora do formato`);
  return msgs.length?`<p class="warnline">${msgs.join(' · ')}</p>`:`<p class="okline">60 cartas, lista válida</p>`;
}
function listToText(p){return p.cards.map(c=>`${c.qty} ${c.name}${c.print?` (${c.print})`:''}`).join('\n')}
function listDiff(oldT,newT){
  const a=parseList(oldT).byName,b=parseList(newT).byName;const ins=[],outs=[];
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{const qa=a[k]?a[k].qty:0,qb=b[k]?b[k].qty:0;if(qb>qa)ins.push(`+${qb-qa} ${(b[k]||a[k]).name}`);if(qa>qb)outs.push(`−${qa-qb} ${(a[k]||b[k]).name}`)});
  return{ins,outs};
}

/* ---------- data ---------- */
const all=kind=>{const r=[];S.docs.forEach((d,id)=>{if(d&&d.kind===kind)r.push(Object.assign({id},d))});return r};
const decks=()=>all('deck').sort((a,b)=>(!!a.archived-!!b.archived)||((b.created||0)-(a.created||0)));
const events=()=>all('event').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||((b.created||0)-(a.created||0)));
const matches=()=>all('match').sort((a,b)=>(a.date||'').localeCompare(b.date||'')||((a.created||0)-(b.created||0)));
const getDoc=id=>{const d=id&&S.docs.get(id);return d?Object.assign({id},d):null};
const openEvent=()=>events().find(e=>e.status==='open');
const eventMatches=id=>matches().filter(m=>m.eventId===id).sort((a,b)=>(a.round||0)-(b.round||0)||(a.created-b.created));
function record(ms){let w=0,l=0,d=0;ms.forEach(m=>{if(m.result==='win')w++;else if(m.result==='loss')l++;else d++});return{w,l,d,n:ms.length}}
const recStr=r=>`${r.w}-${r.l}-${r.d}`;
function prizeTotals(ev){let real=0,est=0;(ev.prizes||[]).forEach(p=>{const t=PRIZE_TYPES.find(x=>x.id===p.type);if(t&&t.real)real+=num(p.value);else est+=num(p.value)});return{real,est}}
const deckName=id=>{const d=getDoc(id);return d?d.name:'Deck removido'};
const activeDecks=()=>decks().filter(d=>!d.archived);

/* ---------- storage ---------- */
function persistLocal(){const o={};S.docs.forEach((d,id)=>o[id]=d);lsSet(LS_DATA,o);lsSet(LS_PENDING,S.pending)}
function markDirty(){lsSet(LS_DIRTY,Date.now())}
function write(id,obj){markDirty();const d=Object.assign({},obj);delete d.id;S.docs.set(id,d);S.pending[id]={op:'set',data:d};persistLocal();flush()}
function remove(id){markDirty();S.docs.delete(id);S.pending[id]={op:'del'};persistLocal();flush()}
async function flush(){
  if(!S.col||S.flushing)return;S.flushing=true;
  try{
    for(const id of Object.keys(S.pending)){
      const p=S.pending[id];
      try{
        if(p.op==='del')await S.col.doc(id).delete();else await S.col.doc(id).set(p.data);
        if(S.pending[id]===p)delete S.pending[id];
        S.syncErr=null;
      }catch(e){
        const code=e&&e.code;
        if(code==='invalid_argument'||code==='not_granted'||code==='revoked'||code==='capability_disabled'){S.mode='local';S.col=null;S.syncErr=null}
        else if(code==='quota_exceeded'){S.syncErr='Espaço de armazenamento cheio'}
        else S.syncErr='Sem conexão';
        break;
      }
    }
  }finally{S.flushing=false;persistLocal();renderStatus()}
  if(S.col&&Object.keys(S.pending).length&&!S.syncErr)flush();
}
setInterval(()=>{if(S.col&&Object.keys(S.pending).length)flush()},20000);
window.addEventListener('online',()=>flush());

async function connect(){
  try{
    if(!window.claude||!window.claude.use)throw 0;
    window.claude.use('downloads').then(d=>{S.downloads=d}).catch(()=>{});
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid)throw 0;
    S.col=db.collection('data/users/'+uid);S.mode='cloud';
    S.col.onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(d=>{if(d.exists)m.set(d.id,d.data())});
      for(const [id,p] of Object.entries(S.pending)){if(p.op==='del')m.delete(id);else m.set(id,p.data)}
      S.docs=m;persistLocal();
      if(!isTyping())render();else renderStatus();
    },()=>{S.mode='local';S.col=null;render()});
    flush();
  }catch(e){S.mode='local'}
  renderStatus();
}
function isTyping(){const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox'))}

/* ---------- live match ---------- */
function saveLive(){lsSet(LS_LIVE,S.live)}
function startLive(o){S.live={eventId:o.eventId||null,round:o.round||null,deckId:o.deckId,format:o.format||'md1',games:[],cur:{me:0,opp:0,first:null,hist:[]},phase:'first',end:null};saveLive();S.ui={};go('counter')}
const gameWins=games=>{let me=0,opp=0;(games||[]).forEach(g=>{if(g.winner==='me')me++;else if(g.winner==='opp')opp++});return{me,opp}};
function resultOf(games){const w=gameWins(games);return w.me>w.opp?'win':w.opp>w.me?'loss':'draw'}
function finishMatch(){const L=S.live;L.phase='result';saveLive();S.form={result:resultOf(L.games),oppInks:[],oppName:'',tags:[],notes:''};go('result')}
function startQuick(o,games){
  S.quick={eventId:o.eventId||null,round:o.round||null,deckId:o.deckId,format:o.format||'md1',back:o.back||'home'};
  S.form={games:games&&games.length?games.map(g=>({winner:g.winner,first:g.first,me:g.me!=null?String(g.me):'',opp:g.opp!=null?String(g.opp):''})):[{winner:null,first:null,me:'',opp:''}],result:null,resultTouched:false,oppInks:[],oppName:'',tags:[],notes:''};
  S.ui={};go('quick');
}

/* ---------- wake lock ---------- */
async function wakeOn(){try{if(navigator.wakeLock&&!S.wake){S.wake=await navigator.wakeLock.request('screen');S.wake.addEventListener('release',()=>{S.wake=null})}}catch(e){S.wake=null}}
function wakeOff(){try{if(S.wake)S.wake.release()}catch(e){}S.wake=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.view==='counter')wakeOn()});

/* ---------- navigation ---------- */
function go(view,sel){S.view=view;if(sel!==undefined)S.sel=sel;if(view==='counter')wakeOn();else wakeOff();render();window.scrollTo(0,0)}
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}

/* ---------- shell ---------- */
function statusHTML(){
  const n=Object.keys(S.pending).length;
  if(STANDALONE||S.mode==='connecting')return'<span id="status"></span>';
  if(S.mode==='local')return(window.claude&&window.claude.use)?'<span class="status warn" id="status" title="Os dados ficam só neste navegador. Faça backup em Ajustes.">Só neste aparelho</span>':'<span class="status" id="status" title="Seus dados ficam guardados neste celular. Faça backup em Ajustes.">No celular</span>';
  if(S.syncErr)return`<span class="status warn" id="status" title="${esc(S.syncErr)}">${n} para salvar</span>`;
  return'<span id="status"></span>';
}

    const ms=eventMatches(ev.id),r=record(ms),d=getDoc(ev.deckId);
    const nextRound=ms.length+1;const done=ev.rounds&&ms.length>=ev.rounds;
    h+=`<div class="card ${L?'':'hero'}">
      <div class="row between"><span class="eyebrow">Evento em andamento</span><span class="small muted">${fmtDate(ev.date)}</span></div>
      <div><h2>${esc(ev.name)}</h2><p class="muted small">${typeName(ev.type)}${ev.store?' · '+esc(ev.store):''} · ${ev.format==='md3'?'Melhor de 3':'Melhor de 1'}${ev.fee?' · inscrição '+brl(ev.fee):''}</p></div>
      <div class="row">${d?inksHTML(d.inks):''}<span><b>${esc(d?d.name:'Deck')}</b></span></div>
      <div class="row between"><span>Campanha <b class="num">${recStr(r)}</b></span><span class="games">${ms.map(m=>resBadge(m.result)).join('')}</span></div>
      ${L?'':`${done?`<p class="small muted">Todas as ${ev.rounds} rodadas jogadas.</p><button class="btn primary big" data-act="go" data-v="closeEvent">Encerrar evento</button>`:''}
       <div class="twin"><button class="btn ${done?'':'gold'} wide" data-act="playRound">${done?'Rodada extra (top cut)':`Jogar rodada ${nextRound}${ev.rounds?' de '+ev.rounds:''}`}</button><button class="btn wide" data-act="quickRound">Só registrar resultado</button></div>
       ${done?'':'<button class="link small" data-act="go" data-v="closeEvent" style="align-self:center">Encerrar evento</button>'}`}
    </div>`;
  }else if(!L){
    h+=`<div class="stack"><button class="btn gold big" data-act="newEvent">Começar evento</button><button class="btn wide" data-act="newCasual">Partida avulsa</button></div>`;
  }
  const ms=matches();
  if(!ms.length&&!ev&&!L){
    h+=`<div class="card empty"><h2>Seu diário começa no próximo evento</h2><ol><li>Comece o evento antes de jogar: deck, formato e inscrição.</li><li>Jogue com o contador; ao chegar a ${LORE_GOAL} de lore o resultado entra sozinho. Ou registre só o resultado.</li><li>Marque as cores do oponente e siga para a próxima rodada.</li></ol></div>`;
  }else if(ms.length){
    const cut=daysAgo(30),m30=ms.filter(m=>(m.date||'')>=cut),r=record(m30);
    const last=ms.slice(-10).reverse();
    const ev30=events().filter(e=>(e.date||'')>=cut);let bal=0;ev30.forEach(e=>{bal+=prizeTotals(e).real-num(e.fee)});
    h+=`<div class="card"><div class="row between"><h3>Últimos 30 dias</h3><button class="link small" data-act="go" data-v="stats">Estatísticas</button></div>
      <div class="tiles"><div class="tile"><b>${r.n}</b><span>partidas</span></div><div class="tile"><b>${r.n?pct(r.w,r.n)+'%':'–'}</b><span>vitórias (<span class="nw">${recStr(r)}</span>)</span></div><div class="tile"><b class="money ${bal>=0?'pos':'neg'}" style="font-size:1.05rem;padding-top:6px">${brl(bal)}</b><span>saldo em dinheiro</span></div></div>
      <div><p class="small muted" style="margin-bottom:6px">Últimas partidas</p><div class="games">${last.map(m=>resBadge(m.result)).join('')}</div></div></div>`;
  }
  return bannerMain()+`<main class="app">${h}</main>`;

  ds.forEach(d=>{h+=`<button type="button" class="deckopt" data-act="pickDeck" data-f="${field}" data-v="${d.id}" aria-pressed="${sel===d.id}">${inksHTML(d.inks)}<span>${esc(d.name)}</span></button>`});

function vCounter(){
  const L=S.live;if(!L){S.view='home';return vHome()}
  const c=L.cur,w=gameWins(L.games),gn=L.games.length+1;
  const side=who=>{const v=c[who];return`<section class="side ${who}" aria-label="${who==='me'?'Você':'Oponente'}">
    <div class="side-head"><span>${who==='me'?'Você':'Oponente'}</span>${c.first===who?'<span class="starts">começou</span>':''}</div>
    <div class="lore-row"><button class="lore-btn minus" data-act="lore" data-who="${who}" data-d="-1" aria-label="Tirar 1 de lore">−</button><output class="lore" aria-live="polite">${v}</output><button class="lore-btn plus" data-act="lore" data-who="${who}" data-d="1" aria-label="Somar 1 de lore">+</button></div>
    <div class="quick"><button data-act="lore" data-who="${who}" data-d="2">+2</button><button data-act="lore" data-who="${who}" data-d="3">+3</button><button data-act="lore" data-who="${who}" data-d="4">+4</button></div>
    <div class="pips" aria-hidden="true">${Array.from({length:LORE_GOAL},(_,i)=>`<i class="${i<v?'on':''}"></i>`).join('')}</div></section>`};
  let h=`<div class="counter">${side('opp')}
   <div class="mid"><button class="btn" data-act="undo" ${c.hist.length?'':'disabled'}>Desfazer</button>
    <div class="mid-info"><strong>Jogo ${gn}</strong> · ${L.format==='md3'?'MD3':'MD1'}${L.format==='md3'?` · <span class="num">${w.me}–${w.opp}</span>`:''}<br><span class="muted">${L.eventId?'Rodada '+L.round:'Avulsa'} · ${esc(deckName(L.deckId))}</span></div>
    <button class="btn" data-act="sheet" data-v="end">Encerrar</button></div>
   ${side('me')}`;
  if(L.phase==='first'){
    const lastG=L.games[L.games.length-1];
    const loser=lastG?(lastG.winner==='me'?'opp':lastG.winner==='opp'?'me':null):null;
    h+=`<div class="overlay"><div class="sheet" role="dialog" aria-label="Quem começa"><h2>Quem começa o jogo ${gn}?</h2>
     ${L.games.length?`<p class="small muted">Quem perdeu o jogo anterior escolhe.${loser?` Quem perdeu: <b>${loser==='me'?'você':'o oponente'}</b>.`:''}</p>`:''}
     <button class="btn ${loser==='me'?'gold':''} big" data-act="first" data-v="me">Eu começo</button>
     <button class="btn ${loser==='opp'?'gold':''} big" data-act="first" data-v="opp">Oponente começa</button>
     <button class="link small" data-act="sheet" data-v="end" style="align-self:center">Mais opções</button></div></div>`;
  }
  if(L.phase==='gameover'&&L.end){
    const e=L.end;const t=e.winner==='me'?'Você venceu':e.winner==='opp'?'Oponente venceu':'Empate';
    h+=`<div class="overlay"><div class="sheet" role="dialog" aria-label="Fim do jogo"><span class="eyebrow">Fim do jogo ${gn}</span><h2>${t}</h2>
     <div class="score">${c.me} <span class="muted" style="font-size:1.4rem">a</span> ${c.opp}</div><p class="small muted" style="text-align:center">Seu lore × lore do oponente${e.how==='manual'?' · encerrado manualmente':''}</p>
     <button class="btn gold big" data-act="confirmGame">Confirmar</button><button class="btn wide" data-act="undoEnd">Voltar ao jogo</button></div></div>`;
  }
  if(S.ui.sheet==='end'){
    h+=`<div class="overlay"><div class="sheet" role="dialog" aria-label="Encerrar"><h2>Encerrar</h2>
     ${S.ui.confirmCancel?`<div class="confirm"><p>Descartar esta partida? Nada será salvo.</p><div class="row"><button class="btn danger" data-act="cancelMatch">Descartar</button><button class="btn" data-act="sheet" data-v="end">Manter</button></div></div>`:`
     <p class="eyebrow">Jogo ${gn}</p>
     <button class="btn wide" data-act="manualEnd" data-v="me">Venci este jogo (oponente desistiu)</button>
     <button class="btn wide" data-act="manualEnd" data-v="opp">Perdi este jogo (desisti)</button>
     <button class="btn wide" data-act="manualEnd" data-v="draw">Empate neste jogo</button>
     <p class="eyebrow" style="margin-top:6px">Partida</p>

     <button class="link small" data-act="sheet" data-v="" style="align-self:center">Fechar</button></div></div>`;
  }
  return h+'</div>';
}

function allTags(cur){const extra=new Set();matches().forEach(m=>(m.tags||[]).forEach(t=>{if(!TAGS.includes(t))extra.add(t)}));(cur||[]).forEach(t=>{if(!TAGS.includes(t))extra.add(t)});return TAGS.concat([...extra])}
function knownPlayers(){const c={};matches().forEach(m=>{if(m.oppPlayer)c[m.oppPlayer]=(c[m.oppPlayer]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
function knownOpps(){
  const by={};const cur=S.view==='match'?S.sel:null;
  matches().forEach(m=>{if(!m.oppName||m.id===cur)return;const k=m.oppName.trim().toLowerCase();const e=by[k]=by[k]||{name:m.oppName.trim(),n:0,keys:{},last:''};e.n++;const ik=inkKey(m.oppInks);if(ik)e.keys[ik]=(e.keys[ik]||0)+1;if((m.date||'')>=e.last){e.last=m.date||'';e.name=m.oppName.trim()}});
  return Object.values(by).map(e=>{const top=Object.entries(e.keys).sort((a,b)=>b[1]-a[1])[0];return{name:e.name,n:e.n,inks:top?top[0].split('+'):[]}}).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
}
function inksForName(name){const k=(name||'').trim().toLowerCase();if(!k)return null;const hit=knownOpps().find(o=>o.name.toLowerCase()===k);return hit&&hit.inks.length?hit:null}
function matchFormHTML(withResult){
  const f=S.form;const key=inkKey(f.oppInks);
  const known=knownOpps();
  let sugg=key?known.filter(k=>inkKey(k.inks)===key):known;sugg=sugg.slice(0,8);
  if(f.oppName&&!sugg.some(k=>k.name===f.oppName)){const cur=known.find(k=>k.name===f.oppName);if(cur)sugg=[cur,...sugg].slice(0,8)}
  const allNames=known.map(k=>k.name);
  const players=knownPlayers();
  return`<div class="card"><label class="f">Nome do oponente<span class="hint">Opcional.</span><input type="text" id="m-oppplayer" data-f="oppPlayer" list="opp-players" value="${esc(f.oppPlayer||'')}" placeholder="Nome ou nick" autocomplete="off"></label><datalist id="opp-players">${players.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
   <div class="card"><h3>Deck do oponente</h3>
    ${sugg.length?`<div class="f"><span>${key?'Decks com essas cores que você já enfrentou':'Decks que você já enfrentou'}</span><div class="seg">${sugg.map(k=>`<button type="button" class="chip sugg" data-act="pickOpp" data-v="${esc(k.name)}" aria-pressed="${f.oppName===k.name}">${inksHTML(k.inks)}${esc(k.name)}</button>`).join('')}</div></div>`:''}
    <div class="f"><span>${sugg.length?'Ou toque nas cores (até 2)':'Toque nas cores (até 2)'}</span>${inkPicker('oppInks',f.oppInks)}</div>
    <label class="f">Apelido do deck<span class="hint">Opcional. Se for um deck que você já registrou, as cores são preenchidas sozinhas.</span><input type="text" id="m-oppname" data-f="oppName" list="opp-names" value="${esc(f.oppName)}" placeholder="Ex.: Steel Songs"></label>
    <datalist id="opp-names">${allNames.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    ${vsBox(key)}

function statsData(){
  const F=S.statsF;
  const dk=F.deck!=='all'?getDoc(F.deck):null;
  if(F.period==='deckver'&&!(dk&&dk.listUpdated))F.period='all';
  const cut=F.period==='30'?daysAgo(30):F.period==='90'?daysAgo(90):F.period==='365'?daysAgo(365):F.period==='deckver'?dk.listUpdated:'';
  const evType=id=>{const e=getDoc(id);return e?e.type:null};
  const ms=matches().filter(m=>(!cut||(m.date||'')>=cut)&&(F.deck==='all'||m.deckId===F.deck)&&(F.type==='all'||(F.type==='casual'?!m.eventId:evType(m.eventId)===F.type)));
  const evs=F.type==='casual'?[]:events().filter(e=>(!cut||(e.date||'')>=cut)&&(F.deck==='all'||e.deckId===F.deck)&&(F.type==='all'||e.type===F.type));
  const r=record(ms);
  const games=[];ms.forEach(m=>(m.games||[]).forEach(g=>games.push(g)));
  const gw=games.filter(g=>g.winner==='me').length;
  const fm=games.filter(g=>g.first==='me'),fo=games.filter(g=>g.first==='opp');
  const fmw=fm.filter(g=>g.winner==='me').length,fow=fo.filter(g=>g.winner==='me').length;
  let cur=0,curT=null,best=0,run=0;ms.forEach(m=>{if(m.result==='win'){run++;best=Math.max(best,run)}else run=0;if(m.result===curT)cur++;else{curT=m.result;cur=1}});
  const groups={};ms.forEach(m=>{const k=inkKey(m.oppInks)||'?';(groups[k]=groups[k]||[]).push(m)});
  const matchups=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([k,list])=>{const rr=record(list);const nm={};list.forEach(m=>{if(m.oppName)nm[m.oppName]=(nm[m.oppName]||0)+1});const top=Object.entries(nm).sort((a,b)=>b[1]-a[1])[0];return{key:k,inks:k==='?'?[]:k.split('+'),label:k==='?'?'Cores não informadas':inkNames(k.split('+')),nick:top?top[0]:'',r:rr}});
  const byD={};ms.forEach(m=>{(byD[m.deckId]=byD[m.deckId]||[]).push(m)});
  const byDeck=Object.entries(byD).sort((a,b)=>b[1].length-a[1].length).map(([id,list])=>({id,deck:getDoc(id),r:record(list)}));
  const byT={};ms.forEach(m=>{const t=m.eventId?evType(m.eventId)||'?':'casual';(byT[t]=byT[t]||[]).push(m)});
  const byType=Object.entries(byT).map(([t,list])=>({t,name:t==='casual'?'Partidas avulsas':typeName(t),r:record(list)}));
  const scored=g=>g.how!=='manual'&&g.me!=null&&g.opp!=null&&g.me!==''&&g.opp!=='';
  const lw=games.filter(g=>g.winner==='me'&&scored(g)),ll=games.filter(g=>g.winner==='opp'&&scored(g));
  const avg=(a,f)=>a.length?(a.reduce((s,g)=>s+Number(f(g)),0)/a.length):null;
  let fee=0,real=0,est=0;evs.forEach(e=>{fee+=num(e.fee);const p=prizeTotals(e);real+=p.real;est+=p.est});
  const places=evs.filter(e=>e.placement);
  return{F,cut,ms,evs,r,games,gw,fm,fo,fmw,fow,cur,curT,best,matchups,byDeck,byType,avgOppWin:avg(lw,g=>g.opp),avgMeLoss:avg(ll,g=>g.me),fee,real,est,tops:evs.filter(e=>e.placement&&e.placement<=8).length,avgPlace:places.length?places.reduce((s,e)=>s+Number(e.placement),0)/places.length:null};
}

function evoCard(ms){
  if(ms.length<3)return`<div class="card"><h3>Evolução</h3><p class="small muted">O gráfico aparece a partir de 3 partidas.</p></div>`;
  const N=10;const pts=ms.map((m,i)=>{const win=ms.slice(Math.max(0,i-N+1),i+1);return{y:pct(win.filter(x=>x.result==='win').length,win.length),d:m.date,n:win.length,r:m.result}});
  const W=340,H=170,L=34,R=10,T=10,B=12,iw=W-L-R,ih=H-T-B;
  const X=i=>L+i*iw/(pts.length-1),Y=v=>T+ih-v/100*ih;
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join('');
  const area=line+`L${X(pts.length-1).toFixed(1)} ${Y(0)}L${X(0).toFixed(1)} ${Y(0)}Z`;
  const last=pts[pts.length-1];const showDots=pts.length<=40;
  const grid=[0,50,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1" ${v===50?'stroke-dasharray="4 4"':''}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`).join('');
  const col=r=>`var(--${r==='win'?'win':r==='loss'?'loss':'draw'})`;

  D.evs.slice().reverse().forEach(e=>{const p=prizeTotals(e);rows.push([fmtDate(e.date),e.name,e.store||'',typeName(e.type),e.format==='md3'?'MD3':'MD1',deckName(e.deckId),recStr(record(eventMatches(e.id))),e.placement||'',e.players||'',csvNum(num(e.fee)),csvNum(p.real),csvNum(p.est),csvNum(p.real-num(e.fee)),(e.prizes||[]).map(z=>`${(PRIZE_TYPES.find(t=>t.id===z.type)||{}).name}${z.desc?' ('+z.desc+')':''}: ${csvNum(z.value)}`).join(' | ')])});

  return bannerMain()+`<main class="app">${h}</main>`;
}
function vDeck(){

  confirmImport:()=>{const imp=S.ui.importData;if(!imp)return;[...S.docs.keys()].forEach(id=>{if(!imp.docs[id])remove(id)});Object.entries(imp.docs).forEach(([id,d])=>write(id,d));lsSet(LS_BACKUP,{at:Date.now()+1,n:imp.n});S.ui={};toast(imp.n+' registros restaurados');render()}
};
function closeForm(ev){return{placement:ev.placement?String(ev.placement):'',players:ev.players?String(ev.players):'',fee:ev.fee?String(ev.fee).replace('.',','):'',prizes:(ev.prizes||[]).map(p=>({type:p.type,value:String(p.value).replace('.',','),desc:p.desc||''})),notes:ev.notes||''}}

function evoMove(e){const box=e.target.closest&&e.target.closest('.evo');if(!box)return;const pts=JSON.parse(box.dataset.pts);const rc=box.getBoundingClientRect();const fx=(e.clientX-rc.left)/rc.width*100;let best=pts[0];pts.forEach(p=>{if(Math.abs(p.x-fx)<Math.abs(best.x-fx))best=p});const svg=box.querySelector('svg');const vb=svg.viewBox.baseVal;const ln=svg.querySelector('.evo-x'),dt=svg.querySelector('.evo-dot');const sx=best.x/100*vb.width,sy=best.y/100*vb.height;ln.setAttribute('x1',sx);ln.setAttribute('x2',sx);ln.setAttribute('visibility','visible');dt.setAttribute('cx',sx);dt.setAttribute('cy',sy);dt.setAttribute('visibility','visible');const tip=box.querySelector('.evo-tip');tip.textContent=best.t;tip.hidden=false;const left=Math.min(Math.max(best.x/100*rc.width,70),rc.width-70);tip.style.left=left+'px';tip.style.top=Math.max(0,best.y/100*rc.height-44)+'px'}
function evoLeave(e){const box=e.target.closest&&e.target.closest('.evo');if(!box)return;box.querySelector('.evo-tip').hidden=true;box.querySelectorAll('.evo-x,.evo-dot').forEach(n=>n.setAttribute('visibility','hidden'))}
document.addEventListener('pointermove',evoMove);document.addEventListener('pointerdown',evoMove);
document.addEventListener('pointerout',e=>{const box=e.target.closest&&e.target.closest('.evo');if(box&&!box.contains(e.relatedTarget))evoLeave(e)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='FORM')return;if(t.disabled)return;e.preventDefault();const fn=A[t.dataset.act];if(fn)fn(t.dataset,t)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-act-submit]');if(!f)return;e.preventDefault();const fn=A[f.dataset.actSubmit];if(fn)fn({})});
function onField(e){const el=e.target;
  if(el.dataset.f){const v=el.type==='checkbox'?el.checked:el.value;setPath(S.form,el.dataset.f,v);
    if(el.dataset.f==='list'){const c=document.getElementById('dl-check');if(c)c.innerHTML=listCheck(parseList(v))}
    if(el.dataset.f==='oppName'&&(e.type==='change'||e.inputType==='insertReplacementText'||(e.type==='input'&&!e.inputType))){const hit=inksForName(v);if(hit){const ch=inkKey(hit.inks)!==inkKey(S.form.oppInks);S.form.oppName=hit.name;S.form.oppInks=[...hit.inks];if(ch){render();toast('Cores de '+hit.name+' preenchidas')}}}}
  else if(el.dataset.sf&&e.type==='change'){S.statsF[el.dataset.sf]=el.value;if(el.dataset.sf==='deck'&&S.statsF.period==='deckver')S.statsF.period='all';lsSet(LS_STATS,S.statsF);S.ui.exportText=null;render()}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='m-newtag'){e.preventDefault();A.addTag()}});
document.addEventListener('input',e=>{if(e.target.dataset.f)onField(e)});
document.addEventListener('change',e=>{onField(e)});
document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const docs=o&&o.docs;if(!docs||typeof docs!=='object')throw 0;const ok={};for(const [id,d] of Object.entries(docs)){if(d&&['deck','event','match'].includes(d.kind)&&/^[A-Za-z0-9_\-.~:@+]+$/.test(id))ok[id]=d}const n=Object.keys(ok).length;if(!n)throw 0;S.ui.importData={docs:ok,n,date:(o.exported||'').slice(0,10)};S.ui.backupSheet=false;render()}catch(err){toast('Esse arquivo não é um backup do Side Quest')}e.target.value=''};r.readAsText(file)});

if(S.live&&S.live.phase){if(S.live.phase==='result'){S.view='result';S.form={result:resultOf(S.live.games),oppInks:[],oppName:'',tags:[],notes:''}}else S.view='counter'}
render();
connect();
if(S.view==='counter')wakeOn();
if(STANDALONE){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
/* Android back button: go to the parent screen instead of closing the app */
const ROOTS=['home','history','stats','decks','settings'];let guard=false,skipPop=false;
function parentOf(v){if(v==='closeEvent'){const ev=getDoc(S.sel);return ev&&ev.status==='done'?'event':'home'}if(v==='match'){const m=getDoc(S.sel);if(m&&m.eventId){S.sel=m.eventId;return'event'}return'history'}if(v==='deckEdit')return S.sel?'deck':'decks';return{newEvent:'home',newCasual:'home',eventEdit:'event',event:'history',matchup:'stats',deck:'decks',history:'home',stats:'home',decks:'home',settings:'home'}[v]||'home'}
function syncGuard(){try{if(S.view!=='home'&&!guard){history.pushState({dl:1},'');guard=true}else if(S.view==='home'&&guard){guard=false;skipPop=true;history.back()}}catch(e){}}
window.addEventListener('popstate',()=>{if(skipPop){skipPop=false;syncGuard();return}guard=false;const v=S.view;
  if(v==='counter'){S.ui.sheet='end';S.ui.confirmCancel=false;render();syncGuard();return}
  if(v==='result'||v==='quick'){toast(v==='quick'?'Toque em Voltar para sair sem salvar':'Salve a partida para continuar');syncGuard();return}
  if(v==='home')return;
  const par=parentOf(v);S.ui={};go(par)});
const _render=render;render=function(){_render();syncGuard()};
if(STANDALONE&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
window.__dl={parseList,listDiff,toCSV,csvFor,summaryText,S,A,render};
})();
